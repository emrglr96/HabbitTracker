<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Alışkanlıklar, görevler, 14 günlük ev işleri planı ve takvim.">
<meta name="theme-color" content="#F8F6FC" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
</div>

<nav id="tabbar" class="tabbar" aria-label="Sayfalar">
  <button data-act="tab" data-tab="today"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.500 6l1 1 2-2M3.500 12l1 1 2-2M3.500 18l1 1 2-2"/></svg></span><span class="tab-tx">Bugün</span></button>
  <button data-act="tab" data-tab="cal"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.500" y="5" width="17" height="15" rx="3"/><path d="M3.500 10h17M8 3v4M16 3v4"/></svg></span><span class="tab-tx">Takvim</span></button>
  <button data-act="tab" data-tab="stats"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></span><span class="tab-tx">Analiz</span></button>
  <button data-act="tab" data-tab="settings"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span><span class="tab-tx">Ayarlar</span></button>
</nav>

<div id="sheetHost" hidden></div>
<div id="toasts" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Bu uygulamanın çalışması için JavaScript gerekli.</p></noscript>
