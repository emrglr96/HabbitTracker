<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ceyda'nın Bahçesi</title>
<meta name="description" content="Alışkanlıklarını ve görevlerini tamamladıkça büyüyen küçük bir bahçe.">
<meta name="theme-color" content="#E3EBCD" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
</div>

<nav id="tabbar" class="tabbar" aria-label="Sayfalar">
  <button data-act="tab" data-tab="today"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg></span><span class="tab-tx">Bugün</span></button>
  <button data-act="tab" data-tab="habits"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.500 2-5 1 1 2 1.500 2.500 1.500C11.500 8 11.500 5.500 12 3z"/></svg></span><span class="tab-tx">Alışkanlık</span></button>
  <button data-act="tab" data-tab="todos"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M3.500 6l1 1 2-2M3.500 12l1 1 2-2M3.500 18l1 1 2-2"/></svg></span><span class="tab-tx">Görevler</span></button>
  <button data-act="tab" data-tab="stats"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></span><span class="tab-tx">Analiz</span></button>
  <button data-act="tab" data-tab="garden"><span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 14.500c0-3 2.500-5 6.500-5 0 3-2.500 5-6.500 5z"/></svg></span><span class="tab-tx">Bahçem</span></button>
</nav>

<div id="sheetHost" hidden></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<noscript><p style="padding:24px;font-family:sans-serif">Bu uygulamanın çalışması için JavaScript gerekli.</p></noscript>
<script src="app.js"></script>
</body>
</html>
